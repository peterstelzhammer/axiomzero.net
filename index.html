<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AxiomZero</title>
<style>
  :root {
    --petrol: #0F3A40;
    --black: #0A0F10;
    --citron: #D4DE4F;
    --bone: #ECEAE3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: var(--black);
    overflow: hidden;
    color: var(--bone);
    font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mark {
    font-size: clamp(2.5rem, 9vw, 6rem);
    letter-spacing: -0.03em;
    line-height: 1;
    user-select: none;
  }
  .mark .a { font-weight: 800; }
  .mark .z { font-weight: 300; color: var(--citron); }
  main { text-align: center; }
  .domain {
    margin-top: 1.25rem;
    font-size: clamp(0.7rem, 1.4vw, 0.85rem);
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: lowercase;
    color: var(--bone);
    opacity: 0.45;
  }
  .mail {
    display: inline-block;
    margin-top: 0.6rem;
    font-size: clamp(0.7rem, 1.4vw, 0.85rem);
    letter-spacing: 0.08em;
    color: var(--citron);
    text-decoration: none;
    opacity: 0.8;
    transition: opacity .2s;
  }
  .mail:hover, .mail:focus-visible { opacity: 1; text-decoration: underline; text-underline-offset: 4px; }

  /* 1 – Atmendes Licht */
  body::before {
    content: "";
    position: fixed;
    left: 50%; top: 40%;
    width: 160vmax; height: 160vmax;
    margin: -80vmax 0 0 -80vmax;
    background: radial-gradient(circle, #14505A 0%, rgba(15,58,64,0.6) 20%, rgba(10,15,16,0) 48%);
    animation: breathe 16s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%   { transform: translate(0, 0) scale(1);          opacity: 1; }
    25%  { transform: translate(12vw, -8vh) scale(1.18);  opacity: .7; }
    50%  { transform: translate(-6vw, 8vh) scale(.85);    opacity: 1; }
    75%  { transform: translate(-12vw, -5vh) scale(1.12); opacity: .75; }
    100% { transform: translate(0, 0) scale(1);          opacity: 1; }
  }

  /* 3 – Lineal-Linie beim Laden */
  main { position: relative; z-index: 1; }
  .brand { display: inline-block; }
  .rule {
    height: 1px;
    margin-top: 1.1rem;
    background: var(--citron);
    height: 2px;
    box-shadow: 0 0 14px 1px rgba(212,222,79,0.5);
    transform: scaleX(0);
    animation: draw 1.4s cubic-bezier(.22,1,.36,1) .5s forwards;
  }
  @keyframes draw { to { transform: scaleX(1); } }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 14px 1px rgba(212,222,79,0.5); }
    50%      { box-shadow: 0 0 22px 3px rgba(212,222,79,0.25); }
  }
  .meta { opacity: 0; animation: fadein 1.2s ease 1.6s forwards; }
  @keyframes fadein { to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    body::before, .rule, .meta { animation: none; }
    .rule { transform: none; }
    .meta { opacity: 1; }
  }
</style>
</head>
<body>
  <main>
    <div class="brand">
      <h1 class="mark" aria-label="AxiomZero"><span class="a">Axiom</span><span class="z">Zero</span></h1>
      <div class="rule" aria-hidden="true"></div>
    </div>
    <div class="meta">
      <p class="domain">axiomzero.net</p>
      <a class="mail" id="m" href="#"></a>
    </div>
  </main>
  <script>
    (function () {
      var u = "contact", d = "axiomzero" + "." + "net", a = u + "\u0040" + d;
      var el = document.getElementById("m");
      el.textContent = a;
      el.href = "mai" + "lto:" + a;
    })();
  </script>
</body>
</html>
